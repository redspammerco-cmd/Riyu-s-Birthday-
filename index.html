<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{
  background:linear-gradient(135deg,#d60000,#8b0000);
  display:flex;justify-content:center;align-items:flex-start;
  min-height:100vh;padding:30px 20px;overflow:hidden;
}
.rain-item{
  position:fixed;top:-60px;
  animation:rainFall linear infinite;
  pointer-events:none;z-index:0;
}
@keyframes rainFall{
  0%{transform:translateY(-60px);opacity:1;}
  100%{transform:translateY(110vh);opacity:0;}
}
.container{
  text-align:center;color:white;
  width:100%;max-width:360px;
  position:relative;z-index:1;
}

/* ---- PHOTO ---- */
.photo-wrap{
  position:relative;
  display:inline-block;
  margin-bottom:0px;
}
.photo{
  width:290px;height:300px;
  border-radius:22px;overflow:hidden;
  border:4px solid #ffaacc;
  box-shadow:0 0 0 3px rgba(255,255,255,0.25),
             0 10px 30px rgba(0,0,0,0.6);
}
.photo img{width:100%;height:100%;object-fit:cover;display:block;}

/* Ribbon on TOP of photo */
.ribbon-top{
  position:absolute;
  top:-24px;left:50%;
  transform:translateX(-50%);
  font-size:52px;line-height:1;
  z-index:10;
  animation:rTop 2s ease-in-out infinite;
  filter:drop-shadow(0 2px 6px rgba(255,80,160,0.9));
}
@keyframes rTop{
  0%,100%{transform:translateX(-50%) rotate(-6deg) scale(1);}
  50%{transform:translateX(-50%) rotate(6deg) scale(1.12);}
}

/* ---- PINK BOW below photo ---- */
.pink-bow{
  display:block;
  font-size:50px;
  margin-top:6px;
  line-height:1;
  animation:bowSway 2.2s ease-in-out infinite;
  filter:drop-shadow(0 3px 8px rgba(255,105,180,0.8));
}
@keyframes bowSway{
  0%,100%{transform:rotate(-8deg) scale(1);}
  50%{transform:rotate(8deg) scale(1.1);}
}

/* ---- KEYPAD ---- */
.keypad-section{
  margin-top:10px;
  animation:slideUp 0.9s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes slideUp{
  0%{transform:translateY(110%);opacity:0;}
  100%{transform:translateY(0);opacity:1;}
}
.title{
  font-size:19px;font-weight:bold;
  letter-spacing:1px;margin-bottom:10px;
  text-shadow:0 2px 8px rgba(0,0,0,0.5);
}
.boxes{
  display:flex;justify-content:center;gap:14px;
  margin-bottom:14px;
}
.box{
  width:46px;height:46px;
  border:2.5px solid rgba(255,255,255,0.85);
  border-radius:12px;
  background:rgba(255,255,255,0.1);
  transition:background 0.2s;
}

/* 4x3 phone grid */
.keys{
  display:grid;
  grid-template-columns:repeat(3,74px);
  grid-template-rows:repeat(4,74px);
  gap:10px;
  justify-content:center;
}
.keys button{
  width:74px;height:74px;
  border-radius:50%;
  border:1.5px solid rgba(255,255,255,0.3);
  background:rgba(255,255,255,0.18);
  color:white;
  font-size:26px;font-weight:bold;
  cursor:pointer;
  transition:background 0.15s,transform 0.1s;
  box-shadow:0 4px 14px rgba(0,0,0,0.3);
}
.keys button:active{
  background:rgba(255,255,255,0.4);
  transform:scale(0.93);
}
.keys button.sym{
  font-size:22px;
  background:rgba(255,255,255,0.07);
  border-color:rgba(255,255,255,0.15);
  cursor:default;
}
</style>
</head>

<script>
// Flowers & hearts rain
(function(){
  var items = [
    "&#127800;","&#10084;&#65039;",
    "&#127800;","&#10084;&#65039;",
    "&#127800;","&#10084;&#65039;",
    "&#128149;","&#127800;"
  ];
  var c = document.getElementById("rain");
  for(var i = 0; i < 35; i++){
    var el = document.createElement("div");
    el.className = "rain-item";
    el.innerHTML = items[i % items.length];
    el.style.left = (Math.random() * 100) + "vw";
    el.style.fontSize = (15 + Math.random() * 18) + "px";
    el.style.animationDuration = (3 + Math.random() * 5) + "s";
    el.style.animationDelay = (-Math.random() * 10) + "s";
    c.appendChild(el);
  }
})();

// Passcode logic
var pass = "1706";
var entered = "";
var boxes = document.querySelectorAll(".box");
var btns = document.querySelectorAll("button[data-v]");

btns.forEach(function(btn){
  btn.addEventListener("click", function(){
    if(entered.length < 4){
      entered += btn.getAttribute("data-v");
      boxes[entered.length - 1].style.background = "white";
    }
    if(entered.length === 4){
      setTimeout(function(){
        if(entered === pass){
          alert("Unlocked ❤️");
        } else {
          alert("Wrong Password");
          entered = "";
          boxes.forEach(function(b){ b.style.background = "transparent"; });
        }
      }, 150);
    }
  });
});
</script>
